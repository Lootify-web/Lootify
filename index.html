<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pixel Bear Custom</title>

<style>
body{
background:#5a2d15;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:monospace;
color:white;
}

.container{
display:flex;
gap:60px;
align-items:center;
}

canvas{
image-rendering:pixelated;
border:4px solid #a67c52;
background:#00000020;
}

.panel{
width:300px;
background:#2b1506;
padding:20px;
}

.panel input,
.panel select,
.panel button{
width:100%;
margin:10px 0;
padding:8px;
background:#3d1f0a;
color:white;
border:none;
}
</style>
</head>
<body>

<div class="container">

<canvas id="bearCanvas"></canvas>

<div class="panel">
<label>Fur Color</label>
<input type="color" id="furColor" value="#8b5a2b">

<button id="saveBtn">SAVE</button>
</div>

</div>

<script>

const canvas=document.getElementById("bearCanvas");
const ctx=canvas.getContext("2d");

const baseImage=new Image();
baseImage.src="./og.bear.png";   // IMPORTANT

const state={
fur:"#8b5a2b"
};

function hexToRgb(hex){
return {
r:parseInt(hex.substr(1,2),16),
g:parseInt(hex.substr(3,2),16),
b:parseInt(hex.substr(5,2),16)
};
}

function recolorFur(){

ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.drawImage(baseImage,0,0);

const imageData=ctx.getImageData(0,0,canvas.width,canvas.height);
const data=imageData.data;
const newColor=hexToRgb(state.fur);

for(let i=0;i<data.length;i+=4){

// detect original brown range
if(data[i] > 90 && data[i] < 170 &&
   data[i+1] > 40 && data[i+1] < 120 &&
   data[i+2] < 100){

data[i] = newColor.r;
data[i+1] = newColor.g;
data[i+2] = newColor.b;

}

}

ctx.putImageData(imageData,0,0);
}

baseImage.onload=function(){

// set canvas size dynamically to image
canvas.width=baseImage.width;
canvas.height=baseImage.height;

// upscale display (pixel perfect)
canvas.style.width=baseImage.width*2+"px";
canvas.style.height=baseImage.height*2+"px";

recolorFur();
};

baseImage.onerror=function(){
alert("og.bear.png NOT FOUND. Put it in same folder as index.html");
};

document.getElementById("furColor").addEventListener("input",e=>{
state.fur=e.target.value;
recolorFur();
});

document.getElementById("saveBtn").addEventListener("click",()=>{
localStorage.setItem("pixelBear",JSON.stringify(state));
alert("saved");
});

const saved=JSON.parse(localStorage.getItem("pixelBear"));
if(saved){
Object.assign(state,saved);
}

</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pixel Bear Custom</title>

<style>
body{
background:#5a2d15;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:monospace;
color:white;
}

.container{
display:flex;
gap:60px;
}

canvas{
image-rendering:pixelated;
width:400px;
height:500px;
border:4px solid #a67c52;
}

.panel{
width:300px;
background:#2b1506;
padding:20px;
}

.panel input,
.panel select,
.panel button{
width:100%;
margin:10px 0;
padding:8px;
background:#3d1f0a;
color:white;
border:none;
}
</style>
</head>
<body>

<div class="container">

<canvas id="bearCanvas" width="256" height="320"></canvas>

<div class="panel">
<label>Fur Color</label>
<input type="color" id="furColor" value="#8b5a2b">

<label>Hat</label>
<select id="hatSelect">
<option value="none">None</option>
<option value="cap">Cap</option>
<option value="crown">Crown</option>
</select>

<label>Glasses</label>
<select id="glassesSelect">
<option value="none">None</option>
<option value="round">Round</option>
<option value="square">Square</option>
</select>

<button id="saveBtn">SAVE</button>
</div>

</div>

<script>

const canvas=document.getElementById("bearCanvas");
const ctx=canvas.getContext("2d");

const baseImage=new Image();
const hatImages={
cap:new Image(),
crown:new Image()
};
const glassesImages={
round:new Image(),
square:new Image()
};

baseImage.src="og.bear.png";
hatImages.cap.src="hat-cap.png";
hatImages.crown.src="hat-crown.png";
glassesImages.round.src="glasses-round.png";
glassesImages.square.src="glasses-square.png";

const state={
fur:"#8b5a2b",
hat:"none",
glasses:"none"
};

function hexToRgb(hex){
return {
r:parseInt(hex.substr(1,2),16),
g:parseInt(hex.substr(3,2),16),
b:parseInt(hex.substr(5,2),16)
};
}

function recolorFur(){

ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.drawImage(baseImage,0,0);

const imageData=ctx.getImageData(0,0,canvas.width,canvas.height);
const data=imageData.data;
const newColor=hexToRgb(state.fur);

for(let i=0;i<data.length;i+=4){

// detect brown fur tone range
if(data[i]>100 && data[i+1]<120 && data[i+2]<100){
data[i]=newColor.r;
data[i+1]=newColor.g;
data[i+2]=newColor.b;
}

}

ctx.putImageData(imageData,0,0);

if(state.hat!=="none"){
ctx.drawImage(hatImages[state.hat],0,0);
}

if(state.glasses!=="none"){
ctx.drawImage(glassesImages[state.glasses],0,0);
}

}

baseImage.onload=()=>recolorFur();

document.getElementById("furColor").addEventListener("input",e=>{
state.fur=e.target.value;
recolorFur();
});

document.getElementById("hatSelect").addEventListener("change",e=>{
state.hat=e.target.value;
recolorFur();
});

document.getElementById("glassesSelect").addEventListener("change",e=>{
state.glasses=e.target.value;
recolorFur();
});

document.getElementById("saveBtn").addEventListener("click",()=>{
localStorage.setItem("pixelBear",JSON.stringify(state));
alert("saved");
});

const saved=JSON.parse(localStorage.getItem("pixelBear"));
if(saved){
Object.assign(state,saved);
}

</script>
</body>
</html>
